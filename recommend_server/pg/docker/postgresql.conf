# ベンチマークの前提を固定するための設定。
#
# 計測値は設定に依存する。設定を書き残さない計測は再現できない。
# 8GB RAM を前提にした配分で、本番にそのまま持ち込む値ではない。

# --- 接続 ---
# 設定ファイルを丸ごと差し替えると、公式イメージが既定で入れる
# listen_addresses = '*' が効かなくなる。既定値は localhost で、
# コンテナ内からしか繋がらない。docker compose exec では露見せず、
# ホストから TCP で繋いだときに "unexpected EOF" として出る。
listen_addresses = '*'

# --- メモリ ---
shared_buffers = 2GB
effective_cache_size = 6GB
work_mem = 16MB

# HNSW の構築でグラフをメモリに載せる。
# 足りないと構築が外部ソートに切り替わり、所要時間が伸びる。
# 実測で確かめられる項目なので、変えたら測り直す。
maintenance_work_mem = 1GB

# --- 並列 ---
max_parallel_workers = 4
max_parallel_workers_per_gather = 2
max_parallel_maintenance_workers = 2

# --- ストレージ（SSD 前提）---
random_page_cost = 1.1
effective_io_concurrency = 200

# --- 計測のための可視化 ---
shared_preload_libraries = 'pg_stat_statements'
pg_stat_statements.track = all

# HNSW の構築が外部ソートに落ちたかをログで確認する。
# 設定した値が効いているかは、設定ファイルではなくログで見る。
log_temp_files = 0
